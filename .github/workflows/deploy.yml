name: Deploy Frontend para GitHub Pages

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  test-backend:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o código
        uses: actions/checkout@v4

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instalar Dependências do Backend
        run: |
          python -m pip install --upgrade pip
          pip install -r notorial-api/requirements.txt

      - name: Rodar Testes Unitários do Backend
        run: |
          cd notorial-api
          python -m pytest tests/ --capture=no

  deploy:
    needs: test-backend
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o código
        uses: actions/checkout@v4
      
      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          
      - name: Instalar Dependências NPM
        run: cd notorial-web && npm install
        
      - name: Criar Aplicativo (Build Frontend)
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_API_URL: ${{ secrets.VITE_API_URL }}
        run: cd notorial-web && npm run build
        
      - name: Setup do Servidor GitHub Pages
        uses: actions/configure-pages@v4
        
      - name: Subir Arquivos
        uses: actions/upload-pages-artifact@v3
        with:
          path: './notorial-web/dist'
          
      - name: Fazer o Deploy!
        id: deployment
        uses: actions/deploy-pages@v4
