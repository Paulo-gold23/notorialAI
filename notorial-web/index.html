<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="LegisVox — Transforme conversas do WhatsApp em atas notariais com inteligência artificial. Upload do ZIP, transcrição de áudios e geração de PDF jurídico automatizada." />
    <meta name="theme-color" content="#0f172a" />
    <meta property="og:title" content="LegisVox — Atas Notariais com IA" />
    <meta property="og:description" content="Automatize a criação de atas notariais a partir de conversas do WhatsApp. Transcrição de áudios, organização por IA e PDF pronto para o cartório." />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://legisvox.com" />
    <title>LegisVox — Atas Notariais com IA</title>
    <script>
      (function() {
        try {
          const theme = localStorage.getItem('theme') || 'system';
          const root = document.documentElement;
          let effectiveTheme = theme;
          if (theme === 'system') {
            effectiveTheme = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
          }
          if (effectiveTheme === 'dark' || effectiveTheme === 'light') {
            root.classList.add(effectiveTheme);
          }
          if (theme !== 'dark' && theme !== 'light' && theme !== 'system') {
            root.classList.add('theme-' + theme);
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
